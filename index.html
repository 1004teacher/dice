<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>평/수 3D 주사위 시뮬레이터</title>
    <!-- Tailwind CSS 로드 -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Google Fonts: Noto Sans KR & Inter -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&family=Noto+Sans+KR:wght@400;700;900&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Noto Sans KR', 'Inter', sans-serif;
            background: radial-gradient(circle at top, #f8fafc 0%, #e2e8f0 100%);
            min-height: 100vh;
            overflow-x: hidden;
        }

        /* 3D 공간 설정 */
        .scene {
            width: 150px;
            height: 150px;
            perspective: 650px;
            margin: 0 auto;
        }

        @media (min-width: 640px) {
            .scene {
                width: 176px;
                height: 176px;
                perspective: 750px;
            }
        }

        /* 주사위 큐브 본체 */
        .cube {
            width: 100%;
            height: 100%;
            position: relative;
            transform-style: preserve-3d;
            transition: transform 1.1s cubic-bezier(0.22, 1, 0.36, 1);
            cursor: pointer;
        }

        /* 주사위 6개 면 공통 스타일 */
        .cube__face {
            position: absolute;
            width: 100%;
            height: 100%;
            border-radius: 24px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 900;
            user-select: none;
            backface-visibility: visible;
            box-shadow: inset 0 0 18px rgba(0, 0, 0, 0.08), 0 4px 10px rgba(0, 0, 0, 0.12);
            border: 2px solid rgba(255, 255, 255, 0.85);
        }

        /* 주사위 (평/수) 스타일 */
        .die-text .cube__face.face-pyeong {
            background: linear-gradient(145deg, #eff6ff, #dbeafe);
            color: #1d4ed8;
            border-color: #bfdbfe;
        }
        .die-text .cube__face.face-su {
            background: linear-gradient(145deg, #fff1f2, #ffe4e6);
            color: #be123c;
            border-color: #fecdd3;
        }

        /* 모바일 기준 큐브 면 위치 (반지름 75px) */
        .cube__face--1 { transform: rotateY(0deg) translateZ(75px); }
        .cube__face--2 { transform: rotateY(90deg) translateZ(75px); }
        .cube__face--3 { transform: rotateY(180deg) translateZ(75px); }
        .cube__face--4 { transform: rotateY(-90deg) translateZ(75px); }
        .cube__face--5 { transform: rotateX(90deg) translateZ(75px); }
        .cube__face--6 { transform: rotateX(-90deg) translateZ(75px); }

        /* 데스크톱/태블릿 기준 큐브 면 위치 (반지름 88px) */
        @media (min-width: 640px) {
            .cube__face--1 { transform: rotateY(0deg) translateZ(88px); }
            .cube__face--2 { transform: rotateY(90deg) translateZ(88px); }
            .cube__face--3 { transform: rotateY(180deg) translateZ(88px); }
            .cube__face--4 { transform: rotateY(-90deg) translateZ(88px); }
            .cube__face--5 { transform: rotateX(90deg) translateZ(88px); }
            .cube__face--6 { transform: rotateX(-90deg) translateZ(88px); }
        }

        /* 버튼 입체감 및 클릭 효과 */
        .roll-btn {
            transition: all 0.15s ease;
            box-shadow: 0 4px 0 #312e81;
        }
        .roll-btn:active:not(:disabled) {
            transform: translateY(3px);
            box-shadow: 0 1px 0 #312e81;
        }
        .roll-btn:disabled {
            opacity: 0.6;
            cursor: not-allowed;
        }

        /* 바닥 그림자 효과 */
        .dice-shadow {
            width: 120px;
            height: 18px;
            background: radial-gradient(ellipse at center, rgba(15, 23, 42, 0.22) 0%, rgba(15, 23, 42, 0) 70%);
            margin: 26px auto 0;
            border-radius: 50%;
            transition: transform 0.6s ease, opacity 0.6s ease;
        }
        .rolling-shadow {
            transform: scale(0.75);
            opacity: 0.4;
        }
    </style>
</head>
<body class="flex flex-col items-center justify-center p-4 sm:p-8 text-slate-800">

    <!-- 헤더 영역 -->
    <header class="text-center mb-7 sm:mb-9 max-w-md">
        <span class="inline-block px-3 py-1 mb-2 text-xs font-bold tracking-wider text-indigo-700 bg-indigo-100 rounded-full">
            각 면 출현 확률 1/6 (평 3면 · 수 3면)
        </span>
        <h1 class="text-2xl sm:text-4xl font-black text-slate-900 tracking-tight">
            🎲 평/수 3D 주사위
        </h1>
        <p class="mt-2 text-sm sm:text-base text-slate-600">
            버튼을 누르거나 주사위(또는 스페이스바)를 눌러 굴려보세요.
        </p>
    </header>

    <!-- 메인 단일 주사위 컨테이너 -->
    <main class="w-full max-w-md bg-white/85 backdrop-blur-md rounded-3xl shadow-xl border border-white p-6 sm:p-8">
        
        <section class="flex flex-col items-center bg-slate-50/90 rounded-2xl p-6 sm:p-8 border border-slate-200/80 shadow-sm">
            <div class="flex items-center justify-between w-full mb-5">
                <span class="text-xs font-bold px-2.5 py-1 rounded-full bg-indigo-100 text-indigo-700">평 3면 · 수 3면</span>
                <button id="btn-sound" onclick="toggleSound()" class="text-xs font-semibold px-2.5 py-1 rounded-full bg-slate-200/80 hover:bg-slate-200 text-slate-700 transition cursor-pointer" title="효과음 켜기/끄기">
                    🔊 효과음 켜짐
                </button>
            </div>

            <!-- 3D 큐브 영역 -->
            <div class="py-4">
                <div class="scene" onclick="rollDie()" title="클릭하여 굴리기">
                    <div id="cube" class="cube die-text">
                        <!-- 인덱스 0 (1번 면): 평 -->
                        <div class="cube__face cube__face--1 face-pyeong text-6xl sm:text-7xl">평</div>
                        <!-- 인덱스 1 (2번 면): 평 -->
                        <div class="cube__face cube__face--2 face-pyeong text-6xl sm:text-7xl">평</div>
                        <!-- 인덱스 2 (3번 면): 평 -->
                        <div class="cube__face cube__face--3 face-pyeong text-6xl sm:text-7xl">평</div>
                        <!-- 인덱스 3 (4번 면): 수 -->
                        <div class="cube__face cube__face--4 face-su text-6xl sm:text-7xl">수</div>
                        <!-- 인덱스 4 (5번 면): 수 -->
                        <div class="cube__face cube__face--5 face-su text-6xl sm:text-7xl">수</div>
                        <!-- 인덱스 5 (6번 면): 수 -->
                        <div class="cube__face cube__face--6 face-su text-6xl sm:text-7xl">수</div>
                    </div>
                </div>
                <div id="shadow" class="dice-shadow"></div>
            </div>

            <!-- 결과 표시 배지 -->
            <div class="mt-4 mb-6 text-center">
                <span class="text-xs text-slate-400 block mb-1">나온 결과</span>
                <div id="result" class="text-3xl font-black text-blue-700 h-9 flex items-center justify-center">
                    평
                </div>
            </div>

            <!-- 굴리기 버튼 -->
            <button id="btn-roll" onclick="rollDie()" class="roll-btn w-full py-4 px-6 bg-indigo-600 hover:bg-indigo-500 text-white font-bold rounded-xl text-lg cursor-pointer flex items-center justify-center gap-2">
                <span>🎲</span>
                <span>굴리기</span>
            </button>
        </section>

        <!-- 하단 통계 및 초기화 영역 -->
        <div class="mt-6 pt-5 border-t border-slate-200/80 flex items-center justify-between text-xs sm:text-sm text-slate-600">
            <div class="flex items-center gap-3">
                <span class="inline-flex items-center gap-1 font-semibold text-blue-700 bg-blue-50 px-2.5 py-1 rounded-lg border border-blue-100">
                    평: <strong id="count-pyeong">0</strong>회 (<span id="rate-pyeong">0</span>%)
                </span>
                <span class="inline-flex items-center gap-1 font-semibold text-rose-700 bg-rose-50 px-2.5 py-1 rounded-lg border border-rose-100">
                    수: <strong id="count-su">0</strong>회 (<span id="rate-su">0</span>%)
                </span>
            </div>
            <button onclick="resetStats()" class="text-xs font-semibold text-slate-400 hover:text-slate-700 underline underline-offset-2 cursor-pointer px-2 py-1">
                초기화
            </button>
        </div>
    </main>

    <!-- 확률 안내 푸터 -->
    <footer class="mt-6 text-center text-xs text-slate-500">
        6개의 각 면이 물리적 편향 없이 정확히 1/6 확률로 선택됩니다.
    </footer>

    <script>
        /**
         * 단일 주사위 데이터 및 상태 관리
         * 인덱스 0, 1, 2는 '평', 인덱스 3, 4, 5는 '수' (총 6면, 각 면 1/6 확률)
         */
        const dieState = {
            faces: ['평', '평', '평', '수', '수', '수'],
            currentIndex: 0,
            rotX: 0,
            rotY: 0,
            isRolling: false,
            soundEnabled: true,
            stats: {
                평: 0,
                수: 0
            }
        };

        // 각 면(0~5)을 정면으로 보여주기 위한 기본 X, Y 회전 각도 매핑
        const faceTargetAngles = [
            { x: 0, y: 0 },     // 면 1 (정면 - 평)
            { x: 0, y: -90 },   // 면 2 (우측 - 평)
            { x: 0, y: 180 },   // 면 3 (후면 - 평)
            { x: 0, y: 90 },    // 면 4 (좌측 - 수)
            { x: -90, y: 0 },   // 면 5 (상단 - 수)
            { x: 90, y: 0 }     // 면 6 (하단 - 수)
        ];

        /**
         * Web Audio API를 이용한 가벼운 주사위 효과음
         */
        let audioCtx = null;
        function playDiceSound(type = 'roll') {
            if (!dieState.soundEnabled) return;
            try {
                if (!audioCtx) {
                    audioCtx = new (window.AudioContext || window.webkitAudioContext)();
                }
                if (audioCtx.state === 'suspended') {
                    audioCtx.resume();
                }

                const now = audioCtx.currentTime;
                if (type === 'roll') {
                    // 굴러가는 짧은 타격음 3연타
                    [0, 0.12, 0.26].forEach((offset, idx) => {
                        const osc = audioCtx.createOscillator();
                        const gain = audioCtx.createGain();
                        osc.type = 'triangle';
                        osc.frequency.setValueAtTime(220 + idx * 45, now + offset);
                        osc.frequency.exponentialRampToValueAtTime(90, now + offset + 0.06);

                        gain.gain.setValueAtTime(0.12, now + offset);
                        gain.gain.exponentialRampToValueAtTime(0.001, now + offset + 0.06);

                        osc.connect(gain);
                        gain.connect(audioCtx.destination);
                        osc.start(now + offset);
                        osc.stop(now + offset + 0.07);
                    });
                } else if (type === 'land') {
                    // 멈출 때 경쾌한 착지음
                    const osc = audioCtx.createOscillator();
                    const gain = audioCtx.createGain();
                    osc.type = 'sine';
                    osc.frequency.setValueAtTime(520, now);
                    osc.frequency.exponentialRampToValueAtTime(660, now + 0.12);

                    gain.gain.setValueAtTime(0.14, now);
                    gain.gain.exponentialRampToValueAtTime(0.001, now + 0.14);

                    osc.connect(gain);
                    gain.connect(audioCtx.destination);
                    osc.start(now);
                    osc.stop(now + 0.15);
                }
            } catch (e) {
                // 오디오 미지원 환경 무시
            }
        }

        function toggleSound() {
            dieState.soundEnabled = !dieState.soundEnabled;
            const btn = document.getElementById('btn-sound');
            btn.textContent = dieState.soundEnabled ? '🔊 효과음 켜짐' : '🔇 효과음 꺼짐';
        }

        /**
         * 암호학적으로 균등한 난수 생성 (0 ~ 5 정수, 각 면 정확히 1/6 확률)
         */
        function getFairRandomFaceIndex() {
            if (window.crypto && window.crypto.getRandomValues) {
                const array = new Uint32Array(1);
                const maxValid = Math.floor(0xFFFFFFFF / 6) * 6;
                let randomVal;
                do {
                    window.crypto.getRandomValues(array);
                    randomVal = array[0];
                } while (randomVal >= maxValid);
                return randomVal % 6;
            }
            return Math.floor(Math.random() * 6);
        }

        /**
         * 주사위 굴리기 실행
         */
        function rollDie() {
            if (dieState.isRolling) return;
            dieState.isRolling = true;

            const cubeEl = document.getElementById('cube');
            const shadowEl = document.getElementById('shadow');
            const btnEl = document.getElementById('btn-roll');
            const resultEl = document.getElementById('result');

            btnEl.disabled = true;
            shadowEl.classList.add('rolling-shadow');
            resultEl.innerHTML = '<span class="text-base font-medium text-slate-400 animate-pulse">굴리는 중...</span>';

            playDiceSound('roll');

            // 6개 면 중 1/6 확률로 무작위 선택
            const targetIndex = getFairRandomFaceIndex();
            dieState.currentIndex = targetIndex;

            const targetAngle = faceTargetAngles[targetIndex];

            // 역동적인 회전을 위해 최소 2~3바퀴(720도 ~ 1080도) 추가 회전
            const extraSpinsX = (Math.floor(Math.random() * 2) + 2) * 360;
            const extraSpinsY = (Math.floor(Math.random() * 2) + 2) * 360;

            const currentModX = dieState.rotX % 360;
            const currentModY = dieState.rotY % 360;

            const deltaX = (targetAngle.x - currentModX + 360) % 360;
            const deltaY = (targetAngle.y - currentModY + 360) % 360;

            dieState.rotX += extraSpinsX + deltaX;
            dieState.rotY += extraSpinsY + deltaY;

            cubeEl.style.transform = `rotateX(${dieState.rotX}deg) rotateY(${dieState.rotY}deg)`;

            // 애니메이션 완료 후 결과 표시
            setTimeout(() => {
                const outcome = dieState.faces[targetIndex];
                playDiceSound('land');

                if (outcome === '평') {
                    resultEl.className = 'text-3xl font-black text-blue-700 h-9 flex items-center justify-center';
                } else {
                    resultEl.className = 'text-3xl font-black text-rose-700 h-9 flex items-center justify-center';
                }
                resultEl.textContent = outcome;

                dieState.stats[outcome]++;
                updateStatsUI();

                shadowEl.classList.remove('rolling-shadow');
                btnEl.disabled = false;
                dieState.isRolling = false;
            }, 1100);
        }

        /**
         * 통계 UI 업데이트
         */
        function updateStatsUI() {
            const pCount = dieState.stats['평'];
            const sCount = dieState.stats['수'];
            const total = pCount + sCount;

            document.getElementById('count-pyeong').textContent = pCount;
            document.getElementById('count-su').textContent = sCount;

            const pRate = total === 0 ? 0 : Math.round((pCount / total) * 100);
            const sRate = total === 0 ? 0 : Math.round((sCount / total) * 100);

            document.getElementById('rate-pyeong').textContent = pRate;
            document.getElementById('rate-su').textContent = sRate;
        }

        /**
         * 통계 초기화
         */
        function resetStats() {
            if (dieState.isRolling) return;
            dieState.stats['평'] = 0;
            dieState.stats['수'] = 0;
            updateStatsUI();
        }

        // 스페이스바 단축키 지원
        window.addEventListener('keydown', (e) => {
            if (e.code === 'Space') {
                e.preventDefault();
                rollDie();
            }
        });
    </script>
</body>
</html>
